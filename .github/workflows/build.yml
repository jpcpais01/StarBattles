name: Build & Release

# Every pull request is built and smoke-tested. Every push to main also
# publishes a GitHub release with the signed Android APK and the single-file
# Windows .exe; the in-game updater reads that release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_RELEASE}_linux.x86_64 godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Put Godot on PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and editor settings
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" > /dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres

      - name: Stamp version and config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
          grep -q '^config/version=' project.godot || sed -i "s/^\[application\]/[application]\n\nconfig\/version=\"$V\"/" project.godot
          sed -i "s/^version\/code=.*/version\/code=${{ steps.ver.outputs.code }}/; s/^version\/name=.*/version\/name=\"$V\"/" export_presets.cfg
          printf '{"version": "%s", "build": %s, "commit": "%s", "date": "%s"}\n' \
            "$V" "${{ github.run_number }}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%MZ)" > config/build_info.json
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            printf '{"apiKey": "%s", "projectId": "%s"}\n' "$FIREBASE_API_KEY" "$FIREBASE_PROJECT_ID" > config/firebase.json
            echo "Firebase config written."
          else
            echo "No Firebase secrets: the build runs with local profiles only."
          fi

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/ci/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=starbattles" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=starbattles-public" >> "$GITHUB_ENV"
          fi

      - name: Import project
        run: godot --headless --path . --import

      - name: Check scripts
        run: godot --headless --path . --script tools/check_scripts.gd

      - name: Smoke test (boot, menu, 20s bot battle)
        run: |
          timeout 300 godot --headless --path . -- --autotest=20 2>&1 | tee autotest.log
          grep -q "\[Autotest\]" autotest.log
          if grep -E "SCRIPT ERROR|Parse Error" autotest.log; then
            echo "::error::Script errors during the smoke test"
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" "build/StarBattles-${{ steps.ver.outputs.version }}.apk"
          test -s "build/StarBattles-${{ steps.ver.outputs.version }}.apk"

      - name: Export Windows exe
        run: |
          godot --headless --path . --export-release "Windows" "build/StarBattles-${{ steps.ver.outputs.version }}.exe"
          test -s "build/StarBattles-${{ steps.ver.outputs.version }}.exe"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: StarBattles-${{ steps.ver.outputs.version }}
          path: build/*
          retention-days: 7

      - name: Release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/release_notes.py > release_notes.md

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Star Battles v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/StarBattles-${{ steps.ver.outputs.version }}.apk
            build/StarBattles-${{ steps.ver.outputs.version }}.exe
